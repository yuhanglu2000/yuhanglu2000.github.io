hero:
  bio: >-
    I am a first-year Ph.D. student at [HKU MMLab](https://mmlab.hk/), co-advised
    by Prof. [Hongyang Li](https://lihongyang.info/) and Prof.
    [Bin Chen](https://www.arch.hku.hk/staff/dla/chen-bin/). My research focuses on building
    intelligent systems that understand and interact with the physical world.
  research_interests:
    - Embodied AI
    - Whole-Body Control
    - 3D Vision
  portrait: /images/profile_photo.jpg
